name: Publish

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install the package
        run: pip install --upgrade pip && pip install --group dev .

      - name: Check that the tag matches the package version
        run: test "v$(python -c 'import scpf; print(scpf.__version__)')" = "$GITHUB_REF_NAME"

      - name: Check formatting
        run: ruff format --check

      - name: Lint
        run: ruff check

      - name: Type-check
        run: mypy

      - name: Run tests
        run: pytest

      - name: Build the source distribution and the wheel
        run: pip install build && python -m build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
