name: CI

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The oldest supported version and the latest one.
        python-version: ["3.10", "3.x"]
    steps:
      - uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Not an editable install, so that the tests run against the contents of the wheel.
      - name: Install the package
        run: pip install --upgrade pip && pip install --group dev .

      - name: Check formatting
        run: ruff format --check

      - name: Lint
        run: ruff check

      - name: Type-check
        run: mypy

      - name: Run tests
        run: pytest
